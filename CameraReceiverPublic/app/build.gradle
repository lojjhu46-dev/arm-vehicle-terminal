plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.camerareceiverpublic'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.camerareceiverpublic"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
